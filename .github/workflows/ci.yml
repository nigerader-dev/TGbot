name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m service_bot validate-kb
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=service_bot --cov-report=term-missing --cov-fail-under=90
