name: Telegram - live acceptance test

# Приёмочная проверка настоящего Bot API и живого диалога.
# Постоянный хостинг выполняет telegram-host.yml; обе работы используют одну
# concurrency-группу, поэтому два polling-процесса никогда не пересекаются.

on:
  push:
    branches: [arena/01a0fe4e-tgbot]
    paths:
      - 'service_bot/**'
      - 'knowledge/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/telegram-demo.yml'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Длительность живой сессии в минутах'
        type: choice
        options: ['5', '15', '30', '60', '180', '348']
        default: '60'

permissions:
  contents: read
  models: read
  pull-requests: write

concurrency:
  group: telegram-bot-${{ github.repository_id }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare and verify Telegram
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEMO_MINUTES: ${{ inputs.duration_minutes || '90' }}
    outputs:
      bot_url: ${{ steps.connection.outputs.bot_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check private token configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Create the TELEGRAM_BOT_TOKEN repository Actions secret. Never put the token in source code."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and verify the prototype
        run: |
          pip install -r requirements-dev.txt
          python -m service_bot validate-kb
          ruff check .
          ruff format --check .
          pytest --cov=service_bot --cov-report=term-missing --cov-fail-under=90
      - name: Verify the AI layer
        continue-on-error: true
        env:
          # auto: ключ -> GitHub Models (токен workflow) -> бесплатные внешние шлюзы
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'auto' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GH_MODELS_TOKEN: ${{ github.token }}
        run: |
          if python -m service_bot ai-check > "$RUNNER_TEMP/ai-check.txt" 2>&1; then
            echo "::notice title=AI layer::model answered from the knowledge base"
          else
            # No usable model: publish why, and which free endpoint still answers.
            python scripts/check_models.py >> "$RUNNER_TEMP/ai-check.txt" 2>&1 || true
          fi
          cat "$RUNNER_TEMP/ai-check.txt"
          {
            echo "## ИИ-слой"
            echo '```'
            cat "$RUNNER_TEMP/ai-check.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check phrasings end to end
        continue-on-error: true
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'auto' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GH_MODELS_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/check_phrasings.py --json "$RUNNER_TEMP/phrasings.json" \
            > "$RUNNER_TEMP/phrasings.txt" 2>&1
          echo "$?" > "$RUNNER_TEMP/phrasings.status"
          set -e
          echo "phrasings exit code: $(cat "$RUNNER_TEMP/phrasings.status")"
          tail -n 12 "$RUNNER_TEMP/phrasings.txt"

      - name: Publish the AI check to the pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -n "$NUMBER" ] && [ "$NUMBER" != "null" ]; then
            {
              echo "### Живой запуск: проверка ИИ-слоя"
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/ai-check.txt"
              echo '```'
              if [ -f "$RUNNER_TEMP/phrasings.json" ]; then
                echo "### Понимание формулировок (ответы строго из базы)"
                echo ""
                python scripts/phrasings_report.py "$RUNNER_TEMP/phrasings.json" || true
                echo ""
              else
                echo "### Понимание формулировок: отчёт не собрался"
                echo ""
                echo "Код выхода: $(cat "$RUNNER_TEMP/phrasings.status" 2>/dev/null || echo 'неизвестен')"
                echo ""
                echo '```'
                tail -n 25 "$RUNNER_TEMP/phrasings.txt" 2>/dev/null || true
                echo '```'
                echo ""
              fi
              echo "Bot API проверяется следующим шагом; живая сессия — в job *Manual live Telegram test*."
            } > "$RUNNER_TEMP/ai-comment.md"
            gh pr comment "$NUMBER" --body-file "$RUNNER_TEMP/ai-comment.md"
          fi
      - name: Verify real Telegram API
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m service_bot probe-telegram --output .cache/telegram-ready.json
      - name: Publish public connection details
        id: connection
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('.cache/telegram-ready.json').read_text())
          print('::notice title=Telegram API checked::' + json.dumps(data, ensure_ascii=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"bot_url={data['bot_url']}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## Telegram connection verified\n\n{data['bot_url']}\n\n")
              summary.write(f"Knowledge entries: {data['entry_count']}. Send `/start`.\n\n")
              summary.write(f"AI layer: {data['ai_model'] or 'выключен (только правила базы)'}.\n\n")
              summary.write(f"Manual live test: {os.environ['DEMO_MINUTES']} minutes.\n")
          PY
      - name: Publish public readiness artifact
        uses: actions/upload-artifact@v7
        with:
          name: telegram-connection-public
          path: .cache/telegram-ready.json
          include-hidden-files: true
          retention-days: 1

  live-test:
    name: Manual live Telegram test
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      DEMO_MINUTES: ${{ inputs.duration_minutes || '90' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'auto' }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      GH_MODELS_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Show verified bot link
        env:
          BOT_URL: ${{ needs.prepare.outputs.bot_url }}
        run: |
          echo "## Manual live test" >> "$GITHUB_STEP_SUMMARY"
          echo "$BOT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "AI: ${{ vars.LLM_PROVIDER || 'auto' }} (ключ -> GitHub Models -> бесплатные внешние шлюзы). Если модель недоступна, отвечают правила базы знаний." >> "$GITHUB_STEP_SUMMARY"
          echo "Stops after $DEMO_MINUTES minutes. This is a bounded acceptance session, not permanent hosting." >> "$GITHUB_STEP_SUMMARY"
      - name: Manual live Telegram acceptance session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m service_bot telegram --duration "$((DEMO_MINUTES * 60))"
      - name: End of live test
        if: always()
        run: echo "The bounded test session has ended. Use telegram-host.yml for scheduled operation." >> "$GITHUB_STEP_SUMMARY"
