name: Telegram - live acceptance test

on:
  push:
    branches: [arena/01a0fe03-tgbot]
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duration of the manual live test (not permanent hosting)'
        type: choice
        options: ['5', '15', '30']
        default: '15'

permissions:
  contents: read

concurrency:
  group: telegram-live-test-${{ github.repository_id }}
  cancel-in-progress: true

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEMO_MINUTES: ${{ inputs.duration_minutes || '15' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check private token configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Create the TELEGRAM_BOT_TOKEN repository Actions secret. Never put the token in source code."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and verify the prototype
        run: |
          pip install -r requirements-dev.txt
          python -m service_bot validate-kb
          ruff check .
          ruff format --check .
          pytest --cov=service_bot --cov-report=term-missing --cov-fail-under=90
      - name: Verify real Telegram API
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m service_bot probe-telegram --output .cache/telegram-ready.json
      - name: Publish public connection details
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('.cache/telegram-ready.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## Telegram connection verified\n\n{data['bot_url']}\n\n")
              summary.write(f"Knowledge entries: {data['entry_count']}. Send `/start`.\n\n")
              summary.write(f"Manual live test: {os.environ['DEMO_MINUTES']} minutes. ")
              summary.write("The bot stops after this test. GitHub Actions is not permanent hosting.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-connection-public
          path: .cache/telegram-ready.json
          include-hidden-files: true
          retention-days: 1
      - name: Manual live Telegram acceptance session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m service_bot telegram --duration "$((DEMO_MINUTES * 60))"
      - name: End of live test
        if: always()
        run: echo "The bounded test session has ended. Use a separate host for permanent operation." >> "$GITHUB_STEP_SUMMARY"
